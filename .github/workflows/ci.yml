# Tests on every push (ubuntu-latest, a standard free runner on a public repo) and the Windows
# packages ONLY on manual dispatch (windows-latest, also standard). No schedules, no larger
# runners. A pre-release (Seth asked for the first one, 2026-10-16) comes from release.yml when a
# v* tag is pushed, or from here: dispatch with a pre-release version and, once the packages have
# passed every test, GitHub makes the tag and the pre-release itself (for a session that can push
# its branch but not tags).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Also build the Windows bundle (PyInstaller --onedir) and upload it as an artifact"
        type: boolean
        default: true
      prerelease_version:
        description: "Publish a GitHub PRE-release v<this> from the tested packages, e.g. 0.1.0-beta.1 (empty: artifact only)"
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Unit tests (Python)
        run: python -m pytest tests --ignore=tests/e2e -q
      - name: Unit tests (JS logic, node:test)
        run: node --test tests/js/*.test.js
      - name: End-to-end (Playwright, no server — file:// + bridged js_api)
        run: python -m pytest tests/e2e -q

  build-windows:
    # the Setup .exe, the portable zip and the program's self-test, as an artifact to try
    # (windows-package.yml; release.yml publishes the same packages from a tag)
    if: github.event_name == 'workflow_dispatch' && (inputs.build_windows || inputs.prerelease_version != '')
    uses: ./.github/workflows/windows-package.yml
    with:
      version: ${{ inputs.prerelease_version != '' && inputs.prerelease_version || format('0.1.0-ci.{0}', github.run_number) }}

  prerelease:
    # only after the packages passed every test (windows-package.yml), and only when asked for
    needs: [test, build-windows]
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.prerelease_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: out
      - name: Publish the pre-release (the tag is made at this commit)
        run: |
          case "$VERSION" in v*) echo "::error::give the version without the v"; exit 1;; esac
          ls -la out
          gh release create "v$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FLEx Scratchpad $VERSION" \
            --notes-file build/RELEASE-NOTES.md \
            --prerelease
