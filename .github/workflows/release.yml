# A GitHub PRE-RELEASE of the Windows packages (Seth, 2026-10-16: "a pre-release, and then our site
# can point to the pre-release download"). Push a tag such as v0.1.0-beta.1 and this runs from the
# tagged commit, so it works from any branch: windows-package.yml builds and tests the Setup .exe
# and the portable zip on a Windows runner, then `publish` makes the pre-release with them, their
# SHA-256 sums and build/RELEASE-NOTES.md. Nothing is published unless every test passed.
# RUN BY HAND TOO (Seth, 2026-10-20: "build and push another pre-release", "mark our latest release
# as a release instead of a pre-release" — a cloud session may push its branch but not a tag, nor
# edit a release): Actions › Release › Run workflow on a branch, with `tag` = the tag to make at that
# branch's head (and `final` to publish it as a full release), or `promote` = an existing tag to
# mark as a full release and the latest, which builds nothing. EVERY RELEASE ALSO LANDS ON MAIN
# (Seth, 2026-10-20: "every time we push a release (or pre-release), we should also commit and push
# to main"): the `main` job fast-forwards main to the released commit — after a pushed tag, after a
# manual release, and on a manual run with neither `tag` nor `promote`, which does only that.
# REMOVE OLD PRE-RELEASES (Seth, 2026-10-20, after 0.1.0: "take the old pre-releases down"): `remove` = the tags whose
# releases to delete, space-separated; only a release marked pre-release or tagged with a pre-release suffix
# (v0.1.0-beta.2) is taken, a plain version such as v0.1.0 is refused, and the git tags stay.
# Public repository, standard runners (windows-latest, ubuntu-latest): free. No schedule.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release this tag, e.g. v0.1.0-beta.3; it is created at the chosen branch's head"
        required: false
        default: ""
      final:
        description: "Publish it as a full release (unticked: a pre-release)"
        type: boolean
        default: false
      promote:
        description: "Instead: mark this EXISTING release's tag as a full release and the latest; builds nothing"
        required: false
        default: ""
      remove:
        description: "Instead: delete these pre-releases (tags, space-separated, e.g. v0.1.0-beta.1); a plain version like v0.1.0 is refused; the git tags stay"
        required: false
        default: ""
      main:
        description: "Also fast-forward main to this commit (Seth, 2026-10-20: every release also lands on main). With neither tag nor promote: only that"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  promote:
    if: ${{ inputs.promote != '' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark the release as final and the latest
        run: gh release edit "${{ inputs.promote }}" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

  remove:
    if: ${{ inputs.remove != '' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAGS: ${{ inputs.remove }}
    steps:
      - name: Delete the pre-releases named
        run: |
          # a pre-release is one MARKED so, or one whose tag carries a pre-release suffix (v0.1.0-beta.2 was
          # promoted to a full release once, and is still a beta); a plain version such as v0.1.0 is refused
          for t in $TAGS; do
            pre=$(gh release view "$t" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo missing)
            if [ "$pre" = "missing" ]; then echo "$t: no such release, nothing to do"; continue; fi
            case "$t" in v*-*) suffix=yes;; *) suffix=no;; esac
            if [ "$pre" != "true" ] && [ "$suffix" != "yes" ]; then echo "::error::$t is a full release with a plain version: refused" >&2; exit 1; fi
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes && echo "deleted the release $t (its tag stays)"
          done

  version:
    # a pushed tag, or a manual run with a tag; a bare manual run (neither tag nor promote) only syncs main
    if: ${{ !inputs.promote && !inputs.remove && !(github.event_name == 'workflow_dispatch' && inputs.tag == '') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in v[0-9]*) ;; *) echo "not a version tag: $tag" >&2; exit 1;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "${tag#v}"

  package:
    needs: version
    uses: ./.github/workflows/windows-package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      MADE_HERE: ${{ inputs.tag != '' }}
      FINAL: ${{ inputs.final }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: out
      - name: Publish the release
        run: |
          ls -la out
          # a pushed tag is a pre-release until a release is called final by hand (or `final` is
          # ticked on a manual run); a manual run makes its tag at this commit
          flags=(--prerelease)
          if [ "$FINAL" = "true" ]; then flags=(--latest); fi
          if [ "$MADE_HERE" = "true" ]; then flags+=(--target "$GITHUB_SHA"); else flags+=(--verify-tag); fi
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FLEx Scratchpad $VERSION" \
            --notes-file build/RELEASE-NOTES.md \
            "${flags[@]}"

  main:
    # every release also lands on main; a bare manual run (no tag, no promote) does only this
    needs: [version, package, publish]
    if: ${{ always() && inputs.main != false && inputs.promote == '' && inputs.remove == '' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bring main up to this commit
        # a fast-forward when main is behind; else a merge commit (main carries the merge commits of
        # pull requests this branch never sees); a conflict stops here and says so
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if git merge --ff-only "$GITHUB_SHA" 2>/dev/null; then
            echo "main fast-forwarded to $(git rev-parse --short HEAD)"
          elif git merge --no-edit -m "Merge the released commit $(git rev-parse --short "$GITHUB_SHA") into main" "$GITHUB_SHA"; then
            echo "main merged with $(git rev-parse --short "$GITHUB_SHA")"
          else
            echo "::error::main and the released commit conflict: merge main into the branch by hand, then release again" >&2
            exit 1
          fi
          git push origin main
