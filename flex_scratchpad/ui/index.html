<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FLEx Scratchpad</title>
<link rel="icon" href="img/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="rail-head">
      <img class="logo" src="img/icon-small.svg" alt="">
      <div class="name">FLEx Scratchpad</div>
      <button class="icon-btn" id="btn-settings" title="Settings">&#9881;</button>
      <button class="icon-btn" id="btn-nav-hide" title="Hide the navigation panes (Ctrl+\)">&#171;</button>
    </div>
    <div class="search-box">
      <span class="ico">&#128269;</span>
      <input id="search" type="text" placeholder="Search notebook  (Ctrl+Shift+F)" autocomplete="off" spellcheck="false">
    </div>
    <div class="rail-body" id="rail-body">
      <div class="rail-section" id="tabs-section" data-sec="tabs">
        <h4><span class="caret">&#9662;</span>Tabs <span class="spacer"></span><button id="btn-add-tab" title="New tab">+</button></h4>
        <div class="sec-body" id="tabs"></div>
      </div>
      <div class="rail-divider" data-test="rail-divider" title="Drag to give this part more or less room; double-click to reset"></div>
      <div class="rail-section" id="folders-section" data-sec="folders">
        <h4><span class="caret">&#9662;</span>Folders <span class="spacer"></span><button id="btn-add-folder" title="New folder">+</button></h4>
        <div class="sec-body" id="folders"></div>
      </div>
      <div class="rail-divider" data-test="rail-divider" title="Drag to give this part more or less room; double-click to reset"></div>
      <div class="rail-section" id="tags-section" data-sec="tags">
        <h4><span class="caret">&#9662;</span>Tags <span class="spacer"></span><button id="btn-edit-tags" title="Edit tags">&#9998;</button></h4>
        <div class="sec-body" id="tags"></div>
      </div>
      <div class="rail-divider" data-test="rail-divider" title="Drag to give this part more or less room; double-click to reset"></div>
      <div class="rail-section" id="ftags-section" data-sec="ftags" hidden>
        <h4><span class="caret">&#9662;</span>FLEx tags <span class="spacer"></span></h4>
        <div class="sec-body" id="ftags"></div>
      </div>
    </div>
    <div class="rail-foot">
      <div class="flex-pill" id="flex-pill" title="FieldWorks connection"><span class="led"></span><span class="label">FLEx: not connected</span></div>
      <div class="flex-pill backup-pill" id="backup-pill" data-test="backup-pill" hidden title="Backup & storage"><span class="bk-ico">&#9729;</span><span class="label">Backup</span></div>
      <div class="flex-pill jobs-pill" id="jobs-pill" data-test="jobs-pill" hidden role="status" aria-live="polite"><span class="jb-ico">&#8681;</span><span class="jb-main"><span class="jb-line"><span class="label">Working…</span><span class="jb-wait" hidden></span></span><span class="jb-track"><span class="jb-fill"></span></span></span></div>
      <div class="flex-pill working-pill" id="working-pill" data-test="working-pill" hidden role="status" title="Waiting for an answer from the program"><span class="spinner"></span><span class="label">Working…</span></div>
    </div>
  </aside>
  <div class="splitter" id="split-rail" title="Drag to resize; double-click to collapse"></div>

  <section id="list">
    <div class="list-head">
      <h2 id="list-title">Notes</h2>
      <button class="icon-btn" id="btn-sort" title="Sort">&#8645;</button>
      <span class="split-btn"><button class="tb primary" id="btn-new-note" title="New note (Ctrl+N)">+ New</button><button class="tb primary" id="btn-new-menu" title="New note or example collection">&#9662;</button></span>
    </div>
    <div class="sub" id="list-sub"></div>
    <label class="list-opt" id="list-subfolders" hidden><input type="checkbox" id="chk-subfolders"> Show notes in subfolders</label>
    <div id="notes"></div>
  </section>
  <div class="splitter" id="split-list" title="Drag to resize; double-click to collapse"></div>

  <main id="editor-pane" class="no-note">
    <button class="nav-toggle" id="btn-nav" title="Show or hide the navigation panes (Ctrl+\)">&#9776;</button>
    <div class="flex-banner" id="flex-banner" hidden><span class="icon">&#9888;</span><span class="text"></span><span class="spacer"></span><button class="btn primary" id="flex-banner-fix">Link a project…</button><button class="btn" id="flex-banner-retry">Retry</button><button class="icon-btn" id="flex-banner-hide" title="Hide until next start">&#10005;</button></div>
    <div class="no-note-msg">
      <div><div class="big">&#128221;</div>Select a note, or press <kbd>Ctrl</kbd>+<kbd>N</kbd> for a new one.</div>
    </div>
    <div class="note-head">
      <div class="row">
        <input class="title-input" id="note-title" placeholder="Untitled note" spellcheck="true">
        <button class="icon-btn" id="btn-pin" title="Pin">&#128204;</button>
        <button class="icon-btn" id="btn-note-menu" title="More">&#8943;</button>
      </div>
      <div class="note-tags" id="note-tags"></div>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="tb primary" id="btn-insert-flex" title="Insert a FLEx entry or text (Ctrl+Shift+L)">&#10133; FLEx object</button>
      <button class="tb" id="btn-chart-search" data-test="btn-chart-search" title="Search every text chart of the project: words, glosses, markers, columns, clause types — built from lists or typed (Ctrl+Shift+K)">&#9638; Search charts</button>
      <button class="tb" id="btn-attach" data-test="btn-attach" title="Attach a file: a copy goes into the notebook's attachments folder. ▾ (or Alt+click) to link to the file where it is instead.">&#128206; Attach</button><button class="tb tb-more" id="btn-attach-more" data-test="btn-attach-more" title="Copy the file into the notebook, or link to it where it is">&#9662;</button>
      <button class="tb" id="btn-refresh-all" title="Reload every FLEx example in every note of this notebook from the project">&#8635; Refresh all</button>
      <button class="tb" id="btn-filters" data-test="tb-filters" title="Visual filters: named sets of FLEx tag styles, switched on and off for this note or everywhere">&#9873; Filters</button>
      <span class="sep"></span>
      <button class="tb" data-ins="h" data-test="tb-heading" title="Heading levels 1–6 (Ctrl+Alt+1…6), and collapsing them"><b>H</b> ▾</button>
      <button class="tb" data-ins="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="tb" data-ins="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="tb" data-ins="mark" title="Highlight (Ctrl+Shift+H)"><span style="background:var(--hl);padding:0 3px;border-radius:2px">ab</span></button>
      <button class="tb" data-ins="code" title="Code (Ctrl+E)">&lt;/&gt;</button>
      <button class="tb" data-ins="link" data-test="tb-link" title="Link (Ctrl+K)">&#128279;</button>
      <span class="sep"></span>
      <button class="tb" data-ins="list" title="Bulleted list">&#8226; List</button>
      <button class="tb" data-ins="task" title="Checklist">&#9745; Checklist</button>
      <button class="tb" data-ins="outdent" data-test="tb-outdent" title="Decrease the list indent (Shift+Tab, Ctrl+[)">&#8676;</button>
      <button class="tb" data-ins="indent" data-test="tb-indent" title="Increase the list indent (Tab, Ctrl+])">&#8677;</button>
      <button class="tb" data-ins="quote" title="Quote">&#10077; Quote</button>
      <span class="sep"></span>
      <button class="tb" data-ins="table" title="Table">&#9638; Table</button>
      <button class="tb" data-ins="hr" title="Divider">&#8213;</button>
      <span class="sep"></span>
      <button class="tb" id="btn-undo" title="Undo (Ctrl+Z)">&#8630;</button>
      <button class="tb" id="btn-redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">&#8631;</button>
      <span class="sep"></span>
      <button class="tb" id="btn-find" title="Find in note (Ctrl+F)">&#128269; Find</button>
      <span class="spacer"></span>
      <button class="tb" id="btn-markers" title="Show or hide the Markdown markers (**bold**, # heading, - list) while editing">&#42;&#42; Markup</button>
    </div>
    <div class="tagfocus" id="tagfocus" hidden></div>
    <div class="findbar" id="findbar" hidden>
      <input id="find-input" type="text" placeholder="Find in note" autocomplete="off">
      <span class="cnt" id="find-count"></span>
      <button class="icon-btn" id="find-prev" title="Previous">&#9650;</button>
      <button class="icon-btn" id="find-next" title="Next">&#9660;</button>
      <button class="icon-btn" id="find-close" title="Close">&#10005;</button>
    </div>
    <div id="editor"></div>
    <div id="collection" hidden></div>
    <div id="chartnote" hidden></div>
    <div class="note-foot">
      <span id="note-updated"></span>
      <span id="note-location"></span>
      <span class="spacer"></span>
      <span id="save-state"></span>
    </div>
  </main>
</div>

<script src="js/util.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/api.js"></script>
<script src="js/jobs.js"></script>
<script src="js/flexref.js"></script>
<script src="js/markdown.js"></script>
<script src="js/interlinear.js"></script>
<script src="js/tagstyles.js"></script>
<script src="js/chart.js"></script>
<script src="js/flexcopy.js"></script>
<script src="js/files.js"></script>
<script src="js/backup.js"></script>
<script src="js/tables.js"></script>
<script src="js/editor.js"></script>
<script src="js/picker.js"></script>
<script src="js/export.js"></script>
<script src="js/collection.js"></script>
<script src="js/chartnote.js"></script>
<script src="js/app.js"></script>
</body>
</html>
