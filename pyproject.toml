[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-scratchpad"
version = "0.1.0"
description = "A notebook for FieldWorks Language Explorer: notes, tables and charts with live FLEx entries and interlinear texts rendered inline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pywebview>=5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Reading FieldWorks projects directly needs flexicon (the successor of flexlibs / flexlibs2)
# and pythonnet; both are Windows-only in practice because they load FieldWorks' own DLLs.
flex = [
    "pyflexicon>=4.12,<5",
    "pythonnet>=3.0.3,<3.2",
]
dev = [
    "pytest>=8",
    "playwright>=1.45",
]
build = [
    "pyinstaller>=6",
]

[project.scripts]
flex-scratchpad = "flex_scratchpad.__main__:main"

[tool.setuptools]
packages = ["flex_scratchpad", "flex_scratchpad.flex"]
include-package-data = true

[tool.setuptools.package-data]
flex_scratchpad = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
